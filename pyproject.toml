[project]
name = "gallery"
version = "0.1.0"
description = "Embedding Gallery: EmbeddingGemma 2 x Gemma 4 museum demo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "pillow>=10",
  "requests>=2.32",
  "httpx>=0.27",
  "scikit-learn>=1.5",
  "umap-learn>=0.5.7",
  "sentence-transformers[image]>=6.1.0",
  "transformers>=5.0",
  "torch>=2.6",
  "pyyaml>=6",
  "tqdm>=4.66",
  "openai>=1.50",
  "tabulate>=0.10.0",
  "faster-whisper>=1.2.1",
  "librosa>=1.0.0",
  "nvidia-cublas-cu12>=12.9.2.10",
  "nvidia-cudnn-cu12>=9,<10",
  "pyshp>=3.1.6",
]

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.48"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gallery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: needs real models on the GPU",
  "net: needs internet",
]
